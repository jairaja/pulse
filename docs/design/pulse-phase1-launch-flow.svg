<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title description">
  <title id="title">PULSE Phase 1 launch flow</title>
  <desc id="description">Four mobile screens showing ready to vote, confirm vote, vote receipt, and next-day result states.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#101828" flood-opacity="0.16"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101828" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F5F8"/>
      <stop offset="1" stop-color="#E8ECF2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.78"/>
    </linearGradient>
    <style>
      .ui { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #6B7078; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
      .brand { fill: #111318; font-size: 20px; font-weight: 800; letter-spacing: 1.8px; }
      .timer { fill: #62666D; font-size: 12px; font-weight: 600; }
      .question { fill: #111318; font-size: 27px; font-weight: 650; letter-spacing: -0.5px; }
      .prompt { fill: #111318; font-size: 16px; font-weight: 650; }
      .body { fill: #62666D; font-size: 13px; font-weight: 500; }
      .button { fill: #111318; font-size: 14px; font-weight: 750; letter-spacing: 0.4px; }
      .buttonInverse { fill: #FFFFFF; font-size: 14px; font-weight: 750; letter-spacing: 0.4px; }
      .blue { fill: #2864FF; }
      .caption { fill: #59616C; font-size: 15px; font-weight: 650; }
      .state { fill: #111318; font-size: 21px; font-weight: 750; }
      .stateNumber { fill: #2864FF; font-size: 13px; font-weight: 800; letter-spacing: 1.4px; }
    </style>
  </defs>

  <rect width="1800" height="980" fill="url(#canvas)"/>
  <text x="82" y="65" class="ui stateNumber">PULSE · PHASE 1</text>
  <text x="82" y="103" class="ui" fill="#111318" font-size="34" font-weight="750" letter-spacing="-0.8">Vote today. Discover the world tomorrow.</text>
  <text x="82" y="134" class="ui" fill="#62666D" font-size="15">One question, one explicit vote, one delayed reveal. No prediction and no live trend.</text>

  <!-- Screen 1 -->
  <g transform="translate(74 176)">
    <text x="0" y="-18" class="ui stateNumber">01</text>
    <text x="32" y="-18" class="ui state">Ready to vote</text>
    <rect width="372" height="738" rx="48" fill="#0F1115" filter="url(#shadow)"/>
    <rect x="8" y="8" width="356" height="722" rx="41" fill="#F7F7F5"/>
    <rect x="132" y="18" width="108" height="28" rx="14" fill="#111318"/>
    <text x="30" y="42" class="ui" fill="#111318" font-size="11" font-weight="700">9:41</text>
    <g transform="translate(26 76)">
      <rect x="-10" y="-18" width="324" height="54" rx="22" fill="url(#glass)" stroke="#FFFFFF" filter="url(#softShadow)"/>
      <text x="6" y="15" class="ui brand">PULSE</text>
      <circle cx="223" cy="8" r="4" fill="#2864FF"/>
      <text x="237" y="13" class="ui timer">18h 42m</text>
    </g>
    <g transform="translate(28 162)">
      <text class="ui label">TODAY · 11 OCT</text>
      <text y="54" class="ui question">
        <tspan x="0">Should cities create</tspan>
        <tspan x="0" dy="36">more car-free streets?</tspan>
      </text>
      <text y="152" class="ui prompt">What do you think?</text>
      <g transform="translate(0 180)">
        <rect width="150" height="58" rx="18" fill="#FFFFFF" stroke="#BEC4CC"/>
        <text x="75" y="36" text-anchor="middle" class="ui button">YES</text>
        <rect x="166" width="150" height="58" rx="18" fill="#FFFFFF" stroke="#BEC4CC"/>
        <text x="241" y="36" text-anchor="middle" class="ui button">NO</text>
      </g>
      <g transform="translate(0 270)">
        <path d="M8 2a6 6 0 1 0 0 12A6 6 0 0 0 8 2Zm0 3v3.5l2.2 1.4" fill="none" stroke="#62666D" stroke-width="1.5" stroke-linecap="round"/>
        <text x="23" y="13" class="ui body">Final result arrives with tomorrow’s question.</text>
      </g>
      <line x1="0" y1="330" x2="316" y2="330" stroke="#D9DDE2"/>
      <text y="365" class="ui body">One vote per person · No login</text>
    </g>
  </g>

  <!-- Screen 2 -->
  <g transform="translate(500 176)">
    <text x="0" y="-18" class="ui stateNumber">02</text>
    <text x="32" y="-18" class="ui state">Confirm choice</text>
    <rect width="372" height="738" rx="48" fill="#0F1115" filter="url(#shadow)"/>
    <rect x="8" y="8" width="356" height="722" rx="41" fill="#F7F7F5"/>
    <rect x="132" y="18" width="108" height="28" rx="14" fill="#111318"/>
    <text x="30" y="42" class="ui" fill="#111318" font-size="11" font-weight="700">9:41</text>
    <g transform="translate(26 76)">
      <rect x="-10" y="-18" width="324" height="54" rx="22" fill="url(#glass)" stroke="#FFFFFF" filter="url(#softShadow)"/>
      <text x="6" y="15" class="ui brand">PULSE</text>
      <circle cx="223" cy="8" r="4" fill="#2864FF"/>
      <text x="237" y="13" class="ui timer">18h 41m</text>
    </g>
    <g transform="translate(28 162)">
      <text class="ui label">TODAY · 11 OCT</text>
      <text y="54" class="ui question">
        <tspan x="0">Should cities create</tspan>
        <tspan x="0" dy="36">more car-free streets?</tspan>
      </text>
      <text y="152" class="ui prompt">What do you think?</text>
      <g transform="translate(0 180)">
        <rect width="150" height="58" rx="18" fill="#2864FF"/>
        <path d="M44 27l5 5 10-11" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="86" y="36" text-anchor="middle" class="ui buttonInverse">YES</text>
        <rect x="166" width="150" height="58" rx="18" fill="#FFFFFF" stroke="#BEC4CC"/>
        <text x="241" y="36" text-anchor="middle" class="ui button">NO</text>
      </g>
      <g transform="translate(0 270)">
        <rect width="316" height="60" rx="20" fill="#111318"/>
        <text x="158" y="37" text-anchor="middle" class="ui buttonInverse">SUBMIT VOTE</text>
      </g>
      <text x="158" y="360" text-anchor="middle" class="ui body">Your vote can’t be changed after submission.</text>
    </g>
  </g>

  <!-- Screen 3 -->
  <g transform="translate(926 176)">
    <text x="0" y="-18" class="ui stateNumber">03</text>
    <text x="32" y="-18" class="ui state">Vote receipt</text>
    <rect width="372" height="738" rx="48" fill="#0F1115" filter="url(#shadow)"/>
    <rect x="8" y="8" width="356" height="722" rx="41" fill="#F7F7F5"/>
    <rect x="132" y="18" width="108" height="28" rx="14" fill="#111318"/>
    <text x="30" y="42" class="ui" fill="#111318" font-size="11" font-weight="700">9:42</text>
    <g transform="translate(26 76)">
      <rect x="-10" y="-18" width="324" height="54" rx="22" fill="url(#glass)" stroke="#FFFFFF" filter="url(#softShadow)"/>
      <text x="6" y="15" class="ui brand">PULSE</text>
      <circle cx="223" cy="8" r="4" fill="#2864FF"/>
      <text x="237" y="13" class="ui timer">18h 40m</text>
    </g>
    <g transform="translate(28 178)">
      <circle cx="158" cy="48" r="38" fill="#E8EFFF"/>
      <path d="M143 48l10 10 21-23" fill="none" stroke="#2864FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="158" y="118" text-anchor="middle" class="ui" fill="#111318" font-size="27" font-weight="750">Vote counted</text>
      <text x="158" y="153" text-anchor="middle" class="ui body">You voted</text>
      <text x="158" y="203" text-anchor="middle" class="ui" fill="#2864FF" font-size="42" font-weight="800">YES</text>
      <rect y="244" width="316" height="1" fill="#D9DDE2"/>
      <text x="158" y="291" text-anchor="middle" class="ui prompt">Results in 18h 40m</text>
      <text x="158" y="319" text-anchor="middle" class="ui body">Return when tomorrow’s question goes live.</text>
      <g transform="translate(0 374)">
        <rect width="316" height="58" rx="19" fill="#FFFFFF" stroke="#BEC4CC"/>
        <text x="158" y="35" text-anchor="middle" class="ui button">SHARE THE QUESTION</text>
      </g>
      <text x="158" y="470" text-anchor="middle" class="ui" fill="#2864FF" font-size="13" font-weight="650">How PULSE works</text>
    </g>
  </g>

  <!-- Screen 4 -->
  <g transform="translate(1352 176)">
    <text x="0" y="-18" class="ui stateNumber">04</text>
    <text x="32" y="-18" class="ui state">Next-day reveal</text>
    <rect width="372" height="738" rx="48" fill="#0F1115" filter="url(#shadow)"/>
    <rect x="8" y="8" width="356" height="722" rx="41" fill="#F7F7F5"/>
    <rect x="132" y="18" width="108" height="28" rx="14" fill="#111318"/>
    <text x="30" y="42" class="ui" fill="#111318" font-size="11" font-weight="700">12:02</text>
    <g transform="translate(26 76)">
      <rect x="-10" y="-18" width="324" height="54" rx="22" fill="url(#glass)" stroke="#FFFFFF" filter="url(#softShadow)"/>
      <text x="6" y="15" class="ui brand">PULSE</text>
      <circle cx="265" cy="8" r="16" fill="#E8EFFF"/>
      <text x="265" y="13" text-anchor="middle" class="ui" fill="#2864FF" font-size="11" font-weight="800">1</text>
    </g>
    <g transform="translate(28 148)">
      <text class="ui label">YESTERDAY’S PULSE</text>
      <text y="37" class="ui" fill="#111318" font-size="16" font-weight="650">Should cities create more car-free streets?</text>
      <text y="116" class="ui" fill="#2864FF" font-size="58" font-weight="800" letter-spacing="-2">64%</text>
      <text x="127" y="113" class="ui" fill="#111318" font-size="24" font-weight="750">YES</text>
      <text y="151" class="ui body">Based on 128,421 votes</text>
      <line x1="0" y1="181" x2="316" y2="181" stroke="#D9DDE2"/>
      <text y="216" class="ui body">You voted</text>
      <text x="316" y="216" text-anchor="end" class="ui prompt">NO</text>
      <text y="249" class="ui body">United Kingdom</text>
      <text x="316" y="249" text-anchor="end" class="ui prompt">59% YES</text>
      <rect y="287" width="316" height="1" fill="#D9DDE2"/>
      <text y="328" class="ui label">TODAY</text>
      <text y="368" class="ui" fill="#111318" font-size="21" font-weight="700">
        <tspan x="0">Should schools ban smartphones</tspan>
        <tspan x="0" dy="28">during lessons?</tspan>
      </text>
      <g transform="translate(0 446)">
        <rect width="316" height="58" rx="19" fill="#111318"/>
        <text x="158" y="36" text-anchor="middle" class="ui buttonInverse">VOTE NOW</text>
      </g>
    </g>
  </g>

  <text x="900" y="954" text-anchor="middle" class="ui" fill="#777E87" font-size="13">Concept mockup · system typography · neutral surfaces · one blue accent · no live trend</text>
</svg>
